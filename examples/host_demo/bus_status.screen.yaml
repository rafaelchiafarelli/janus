# SERIAL tab -- read-only monitor of the CAN0/CAN1/RS-485 signal-generator
# config received over MAVLink from the PC app (BusStatusScreen.h,
# lib/MavlinkComms/src/MavlinkComms.h). No encoder-driven editing here,
# matching the real screen's cursor-less behavior.
#
# font_size (2026-09-05, see runtime/embedded_c/include/janus_font.h):
# the screen header renders at `medium` (10x14) and so does every label
# inside a box -- `large` (20x28, the default) is reserved for things
# that need to read at a glance from a distance, which none of this
# dense, read-only monitor content is. Sizes below are re-tuned for
# medium's ~11px/char (1px pad + 10 + 1px gap) instead of large's ~21px.
screen: BusStatus
layout: column
children:
  - { kind: header, id: bus_status_header, text: "SERIAL", font_size: medium, size: { w: 70, h: 20 } }

  - kind: box
    id: can0_box
    layout: row
    collapsible: false
    default_expanded: true
    fill: true
    children:
      - { kind: led, id: can0_led, bind: { message: bus_status, field: can0_enabled, type: int }, states: [off, on], size: { w: 10, h: 10 } }
      - { kind: label, id: can0_label, text: "CAN0", font_size: medium, size: { w: 50, h: 18 } }
      - { kind: label, id: can0_id, bind: { message: bus_status, field: can0_id, type: int }, font_size: medium, size: { w: 60, h: 18 } }
      - { kind: label, id: can0_dlc, bind: { message: bus_status, field: can0_dlc, type: int }, font_size: medium, size: { w: 30, h: 18 } }
      - { kind: label, id: can0_extended, bind: { message: bus_status, field: can0_extended, type: int }, font_size: medium, fill: true }

  - kind: box
    id: can1_box
    layout: row
    collapsible: false
    default_expanded: true
    fill: true
    children:
      - { kind: led, id: can1_led, bind: { message: bus_status, field: can1_enabled, type: int }, states: [off, on], size: { w: 10, h: 10 } }
      - { kind: label, id: can1_label, text: "CAN1", font_size: medium, size: { w: 50, h: 18 } }
      - { kind: label, id: can1_id, bind: { message: bus_status, field: can1_id, type: int }, font_size: medium, size: { w: 60, h: 18 } }
      - { kind: label, id: can1_dlc, bind: { message: bus_status, field: can1_dlc, type: int }, font_size: medium, size: { w: 30, h: 18 } }
      - { kind: label, id: can1_extended, bind: { message: bus_status, field: can1_extended, type: int }, font_size: medium, fill: true }

  - kind: box
    id: rs485_box
    layout: row
    collapsible: false
    default_expanded: true
    fill: true
    children:
      - { kind: led, id: rs485_led, bind: { message: bus_status, field: rs485_enabled, type: int }, states: [off, on], size: { w: 10, h: 10 } }
      - { kind: label, id: rs485_label, text: "RS485", font_size: medium, size: { w: 60, h: 18 } }
      - { kind: label, id: rs485_length, bind: { message: bus_status, field: rs485_length, type: int }, font_size: medium, size: { w: 50, h: 18 } }
      - { kind: label, id: rs485_period_ms, bind: { message: bus_status, field: rs485_period_ms, type: int }, font_size: medium, fill: true }
